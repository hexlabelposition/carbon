name: Windows build

# A Windows installer of any branch, built on request, to try a change on
# Windows without a release: `gh workflow run windows-build.yml --ref <branch>`,
# then `gh run download` once it is done. Releases are built by release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target
          save-if: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The NSIS installer of tauri.conf.json, not signed.
      - name: Build the installer
        run: bun tauri build
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: carbon-windows-${{ github.sha }}
          path: tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
