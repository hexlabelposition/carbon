name: Build

# Checks that the app compiles on Windows. Linux is compiled by the
# end-to-end tests (e2e.yml), the packages for a version tag (release.yml).
# Changes that cannot affect the build (documentation, the landing page)
# skip it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - "website/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - "website/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Debug info is not needed to check that the app compiles. Leaving it out
  # makes the build faster and the cache smaller.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          # Pull requests read the cache from main but do not write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bun
      # A debug build without installers.
      - name: Build the app
        run: bun tauri build --debug --no-bundle
