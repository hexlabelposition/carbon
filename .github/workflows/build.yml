name: Build

# The slow part of CI, kept apart so that changes that cannot affect the
# build (documentation) skip it. The quick checks are in ci.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Debug info is not needed to check that the app compiles. Leaving it out
  # makes the build faster and the cache smaller.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target
          # Pull requests read the cache from main but do not write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # A debug build without installers: CI checks that the app compiles.
      # The Linux packages are built for a version tag (release.yml).
      - name: Build the app
        run: bun tauri build --debug --no-bundle

  e2e:
    name: End-to-end tests
    # The main flows in the real app on Linux (C-609): WebKitGTK under a
    # virtual display, driven by tauri-driver on top of WebKitWebDriver.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies, the WebKit driver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the end-to-end tests
        run: xvfb-run --auto-servernum bun run e2e
      # The screenshots and the log of the app, kept by a failed run.
      - name: Keep what the failed run left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-profile
          path: /tmp/carbon-e2e-*
          if-no-files-found: ignore
