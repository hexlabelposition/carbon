name: Release

# Builds the packages for a version tag, such as v0.1.0, and puts them on
# a draft GitHub release (the one written by hand for the tag, or a new
# one), to check and publish by hand: the deb and the AppImage for Linux
# (C-604), the installer for Windows (C-608), and the latest.json the
# updater reads (C-607, ADR-034). Published as a regular release, not a
# pre-release: the app looks at releases/latest, which skips pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  # To create the release and upload the packages to it.
  contents: write

jobs:
  # One draft for every package: two builds that each made their own would
  # make two releases, as a draft cannot be found by its tag.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The packages are named by the version in package.json, which
      # tauri.conf.json reads, not by the tag: the two must agree.
      - name: Check the tag against the version
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version, the version in package.json"
            exit 1
          fi
      # The draft written by hand for this version, with its notes, gets
      # the packages and keeps its text. A draft is not found by
      # releases/tags/{tag}, but it is in the list of releases, with the
      # tag it is meant for. Without one, a new draft is made from
      # release-notes.md.
      - name: Find or create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          id=$(head -n 1 <<< "$ids")
          if [ -n "$id" ]; then
            if [ "$(wc -l <<< "$ids")" -gt 1 ]; then
              echo "::warning::Several drafts for $GITHUB_REF_NAME, using release $id"
            fi
            echo "Using the draft release $id"
            echo "id=$id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One call that answers with the id: a draft just made is not in
          # the list of releases yet, so it could not be found again.
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Carbon $GITHUB_REF_NAME" \
            -F body=@.github/release-notes.md \
            -F draft=true \
            --jq .id)
          if [ -z "$id" ]; then
            echo "The draft release was not made"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: draft
    # The oldest Ubuntu the runners have: an AppImage runs where the glibc
    # is as old as the one it was built with, or newer.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # With the secret TAURI_SIGNING_PRIVATE_KEY, each package also gets
      # its signature for the updater, and the draft its latest.json
      # (ADR-034). Without it, the app cannot update to this release.
      - name: Choose whether to sign for the updater
        id: updater
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$UPDATER_KEY" ]; then
            echo "args=--config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'" >> "$GITHUB_OUTPUT"
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY: no update for the app to install"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      # The deb and the AppImage of tauri.conf.json.
      - name: Build the packages and attach them to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          args: ${{ steps.updater.outputs.args }}

  windows:
    name: Windows installer
    # After the Linux packages: each adds its entries to the latest.json
    # of the draft, and two at once could lose the entries of the other.
    needs: [draft, linux]
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Not signed yet (C-608). Once a signing service is set up, its
      # command goes in the secret WINDOWS_SIGN_COMMAND, with %1 for the
      # file, and every executable of the installer is signed with it.
      # The signatures for the updater, as for Linux (ADR-034).
      - name: Choose how to sign
        id: sign
        shell: bash
        env:
          SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          config='{"bundle":{}}'
          if [ -n "$SIGN_COMMAND" ]; then
            config=$(jq -c --arg cmd "$SIGN_COMMAND" '.bundle.windows.signCommand = $cmd' <<< "$config")
          else
            echo "No WINDOWS_SIGN_COMMAND: the installer is not signed"
          fi
          if [ -n "$UPDATER_KEY" ]; then
            config=$(jq -c '.bundle.createUpdaterArtifacts = true' <<< "$config")
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY: no update for the app to install"
          fi
          echo "args=--config '$config'" >> "$GITHUB_OUTPUT"
      # The NSIS installer of tauri.conf.json: for the current user, no
      # administrator rights, in English or Russian by the system.
      - name: Build the installer and attach it to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          args: ${{ steps.sign.outputs.args }}
