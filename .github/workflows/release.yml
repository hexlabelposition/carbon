name: Release

# Builds the packages for a version tag, such as v0.1.0, and puts them on
# a draft GitHub release (the one written by hand for the tag, or a new
# one), to check and publish by hand: the deb and the AppImage for Linux
# (C-604), the installer for Windows (C-608), and the latest.json the
# updater reads (C-607, ADR-034). Linux and Windows are built at once; the
# latest.json is written after both, from their signatures. Published as a regular release, not a
# pre-release: the app looks at releases/latest, which skips pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  # To create the release and upload the packages to it.
  contents: write

jobs:
  # One draft for every package: two builds that each made their own would
  # make two releases, as a draft cannot be found by its tag.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The packages are named by the version in package.json, which
      # tauri.conf.json reads, not by the tag: the two must agree.
      - name: Check the tag against the version
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version, the version in package.json"
            exit 1
          fi
      # The draft written by hand for this version, with its notes, gets
      # the packages and keeps its text. A draft is not found by
      # releases/tags/{tag}, but it is in the list of releases, with the
      # tag it is meant for. Without one, a new draft is made with no text:
      # the notes are written by hand before it is published.
      - name: Find or create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          id=$(head -n 1 <<< "$ids")
          if [ -n "$id" ]; then
            if [ "$(wc -l <<< "$ids")" -gt 1 ]; then
              echo "::warning::Several drafts for $GITHUB_REF_NAME, using release $id"
            fi
            echo "Using the draft release $id"
            echo "id=$id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One call that answers with the id: a draft just made is not in
          # the list of releases yet, so it could not be found again.
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="$GITHUB_REF_NAME" \
            -F draft=true \
            --jq .id)
          if [ -z "$id" ]; then
            echo "The draft release was not made"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: draft
    # The oldest Ubuntu the runners have: an AppImage runs where the glibc
    # is as old as the one it was built with, or newer.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The dependencies built by cache.yml on main: a tag sees the caches
      # of main, not those of an earlier tag, so it saves none.
      - uses: ./.github/actions/rust
        with:
          shared-key: release
          save-if: false
      - uses: ./.github/actions/bun
      # With the secret TAURI_SIGNING_PRIVATE_KEY, each package also gets
      # its signature for the updater, from which the updater job writes
      # the latest.json (ADR-034). Without it, the app cannot update.
      - name: Choose whether to sign for the updater
        id: updater
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$UPDATER_KEY" ]; then
            echo "args=--config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'" >> "$GITHUB_OUTPUT"
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY: no update for the app to install"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      # The deb and the AppImage of tauri.conf.json.
      - name: Build the packages and attach them to the draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          args: ${{ steps.updater.outputs.args }}
          # Written once for both systems, by the updater job.
          includeUpdaterJson: false

  windows:
    name: Windows installer
    # At the same time as the Linux packages: neither writes the latest.json,
    # so neither can lose the entries of the other.
    needs: draft
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The dependencies built by cache.yml on main: a tag sees the caches
      # of main, not those of an earlier tag, so it saves none.
      - uses: ./.github/actions/rust
        with:
          shared-key: release
          save-if: false
      - uses: ./.github/actions/bun
      # Not signed yet (C-608). Once a signing service is set up, its
      # command goes in the secret WINDOWS_SIGN_COMMAND, with %1 for the
      # file, and every executable of the installer is signed with it.
      # The signatures for the updater, as for Linux (ADR-034).
      - name: Choose how to sign
        id: sign
        shell: bash
        env:
          SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          config='{"bundle":{}}'
          if [ -n "$SIGN_COMMAND" ]; then
            config=$(jq -c --arg cmd "$SIGN_COMMAND" '.bundle.windows.signCommand = $cmd' <<< "$config")
          else
            echo "No WINDOWS_SIGN_COMMAND: the installer is not signed"
          fi
          if [ -n "$UPDATER_KEY" ]; then
            config=$(jq -c '.bundle.createUpdaterArtifacts = true' <<< "$config")
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY: no update for the app to install"
          fi
          echo "args=--config '$config'" >> "$GITHUB_OUTPUT"
      # The NSIS installer of tauri.conf.json: for the current user, no
      # administrator rights, in English or Russian by the system.
      - name: Build the installer and attach it to the draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          args: ${{ steps.sign.outputs.args }}
          includeUpdaterJson: false

  updater:
    name: Updater manifest
    # The latest.json the app reads to update (ADR-034), once both systems
    # are on the draft: one entry for each signed package, under the names
    # tauri-action gives them. Without the signatures (no
    # TAURI_SIGNING_PRIVATE_KEY) there is nothing to write.
    needs: [draft, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json from the signatures and attach it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.draft.outputs.id }}
        run: |
          assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets")
          # The signature of the package whose name ends with $1, as a JSON
          # entry of the manifest, or nothing if it was not signed.
          entry() {
            local sig id name
            sig=$(jq -r --arg end "$1.sig" '.[] | select(.name | endswith($end)) | .id' <<< "$assets" | head -n 1)
            [ -z "$sig" ] && return
            name=$(jq -r --argjson id "$sig" '.[] | select(.id == $id) | .name | rtrimstr(".sig")' <<< "$assets")
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$sig" > signature
            jq -n --rawfile signature signature \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name" \
              '{signature: $signature, url: $url}'
          }
          appimage=$(entry .AppImage)
          deb=$(entry .deb)
          nsis=$(entry -setup.exe)
          if [ -z "$appimage$deb$nsis" ]; then
            echo "No signatures: no latest.json, the app cannot update to this release"
            exit 0
          fi
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson appimage "${appimage:-null}" \
            --argjson deb "${deb:-null}" \
            --argjson nsis "${nsis:-null}" \
            '{
              version: $version,
              notes: "",
              pub_date: $date,
              platforms: ({
                "linux-x86_64": $appimage,
                "linux-x86_64-appimage": $appimage,
                "linux-x86_64-deb": $deb,
                "windows-x86_64": $nsis,
                "windows-x86_64-nsis": $nsis
              } | with_entries(select(.value != null)))
            }' > latest.json
          cat latest.json
          # A run made again replaces the one there.
          old=$(jq -r '.[] | select(.name == "latest.json") | .id' <<< "$assets")
          if [ -n "$old" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets?name=latest.json"
