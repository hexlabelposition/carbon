name: Installer

# A Windows installer of any branch, built on request, to try a change on
# Windows without a release: `gh workflow run installer.yml --ref <branch>`,
# then `gh run download` once it is done. Releases are built by release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          save-if: false
      - uses: ./.github/actions/bun
      # The NSIS installer of tauri.conf.json, not signed.
      - name: Build the installer
        run: bun tauri build
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: carbon-windows-${{ github.sha }}
          path: tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
