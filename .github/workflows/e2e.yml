name: E2E

# The main flows in the real app on Linux (C-609): WebKitGTK under a
# virtual display, driven by tauri-driver on top of WebKitWebDriver. Also
# the build check of Linux: the app is compiled for the tests.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - "website/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - "website/**"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  e2e:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the WebKit driver and a virtual display
        run: |
          # WebKitWebDriver: webkitgtk-webdriver since Ubuntu 26.04, before
          # that webkit2gtk-driver.
          sudo apt-get install -y xvfb
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          command -v WebKitWebDriver
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - uses: ./.github/actions/bun
      # The interface as a release bundles it; the tests load it from Vite.
      - name: Build the interface
        run: bun run build
      - name: Run the end-to-end tests
        run: xvfb-run --auto-servernum bun run e2e
      # The screenshots and the log of the app, kept by a failed run.
      - name: Keep what the failed run left
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-profile
          path: /tmp/carbon-e2e-*
          if-no-files-found: ignore
