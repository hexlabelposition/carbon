name: Rust
description: >
  Sets up what the Tauri app compiles with: the system libraries of Tauri on
  Linux, stable Rust, and the cache of the Rust build.

inputs:
  shared-key:
    description: >
      A cache shared by jobs that build alike, such as `release` for the
      release profile; without it each job has a cache of its own.
    default: ""
  save-if:
    description: Whether this job saves the cache, or only reads it.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Tauri system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: tauri -> target
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
