[package]
name = "carbon"
version = "0.1.0"
description = "Fast, local-first notes with links"
authors = ["Vladyslav Kudriashov"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "carbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
# The version the `sql` plugin uses, for `sql_batch` on its pools (ADR-029).
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }

# Spell checking in the WebView of Linux (ADR-027): the version Tauri uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
